# make CTRL+a the 'prefix' like screen.
set -g mouse on
bind C-a send-prefix
set -g prefix C-a
# get rid of the tmux standard of CTRL+b
unbind C-b

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g default-terminal "screen-256color"
set-option -g history-limit 3000

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi c
bind-key -T copy-mode-vi c send-keys -X copy-pipe-and-cancel "xclip -selection clip -f | xclip -sel p"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Tmux Resurrect plugin
# run-shell ~/repos/tmux-resurrect/resurrect.tmux